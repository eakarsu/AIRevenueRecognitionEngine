name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        run: npm ci
        working-directory: backend
      - name: Governed revenue tests
        run: npm test
        working-directory: backend
      - name: Syntax and migration safety checks
        run: |
          node --check backend/server.js
          node --check backend/routes/governedRevenue.js
          node --check backend/domain/revenuePolicy.js
          bash -n start.sh scripts/*.sh
          ! grep -Eiq '(^|[[:space:]])(DROP[[:space:]]+TABLE|TRUNCATE|DELETE[[:space:]]+FROM)' backend/migrations/004_governed_revrec.sql
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Frontend build
        run: npm run build
        working-directory: frontend
